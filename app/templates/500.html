{% extends "base.html" %}

{% block title %}500 - Internal Server Error{% endblock %}

{% block content %}
<div class="text-center py-5">
    <h1 class="display-1 fw-bold text-danger">500</h1>
    <h3 class="fw-bold text-navy mb-2">Internal Processing Error</h3>
    <p class="text-secondary mb-3">An unexpected error occurred during medical data processing or neural inference.</p>
    {% if error %}
        <div class="alert alert-danger d-inline-block text-start small font-monospace mb-4" style="max-width: 600px;">
            {{ error }}
        </div>
        <br>
    {% endif %}
    <a href="{{ url_for('dashboard.dashboard') }}" class="btn btn-clinical-primary">
        &larr; Return to Dashboard
    </a>
</div>
{% endblock %}
