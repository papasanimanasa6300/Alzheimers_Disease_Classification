{% extends "base.html" %}

{% block title %}Sign In - Alzheimer's Diagnostic Platform{% endblock %}

{% block public_content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="card card-clinical p-4 shadow-sm">
                <div class="text-center mb-4">
                    <div class="stat-icon icon-blue mx-auto mb-2">
                        <i class="fa-solid fa-lock"></i>
                    </div>
                    <h4 class="fw-bold text-navy" style="color: #0f2942;">System Login</h4>
                    <p class="text-muted small">Enter your credentials to access the clinical portal</p>
                </div>

                <form method="POST" action="{{ url_for('auth.login', next=request.args.get('next')) }}">
                    <div class="mb-3">
                        <label class="form-label small fw-semibold text-secondary">Username or Email</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="fa-regular fa-user text-muted"></i></span>
                            <input type="text" name="username" class="form-control" placeholder="e.g. dr_smith" value="{{ login_id or '' }}" required autofocus>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label small fw-semibold text-secondary">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="fa-solid fa-key text-muted"></i></span>
                            <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-clinical-primary w-100 py-2">
                        <i class="fa-solid fa-right-to-bracket me-1"></i> Sign In
                    </button>
                </form>

                <div class="text-center mt-4 pt-3 border-top">
                    <span class="small text-muted">Don't have an account? </span>
                    <a href="{{ url_for('auth.register') }}" class="small fw-semibold text-decoration-none">Register here</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
