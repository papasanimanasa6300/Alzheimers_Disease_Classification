{% extends "base.html" %}

{% block title %}Create Account - Alzheimer's Diagnostic Platform{% endblock %}

{% block public_content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card card-clinical p-4 shadow-sm">
                <div class="text-center mb-4">
                    <div class="stat-icon icon-emerald mx-auto mb-2">
                        <i class="fa-solid fa-user-plus"></i>
                    </div>
                    <h4 class="fw-bold text-navy" style="color: #0f2942;">Create Account</h4>
                    <p class="text-muted small">Register to record MRI scans, evaluate assessments, and export reports</p>
                </div>

                <form method="POST" action="{{ url_for('auth.register') }}">
                    <div class="mb-3">
                        <label class="form-label small fw-semibold text-secondary">Username</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="fa-regular fa-user text-muted"></i></span>
                            <input type="text" name="username" class="form-control" placeholder="Choose a username" value="{{ username or '' }}" required autofocus>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-semibold text-secondary">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="fa-regular fa-envelope text-muted"></i></span>
                            <input type="email" name="email" class="form-control" placeholder="name@institution.edu" value="{{ email or '' }}" required>
                        </div>
                    </div>

                    <div class="row g-2 mb-4">
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold text-secondary">Password</label>
                            <input type="password" name="password" class="form-control" placeholder="Min. 6 chars" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold text-secondary">Confirm Password</label>
                            <input type="password" name="confirm_password" class="form-control" placeholder="Repeat password" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-clinical-primary w-100 py-2">
                        <i class="fa-solid fa-check me-1"></i> Complete Registration
                    </button>
                </form>

                <div class="text-center mt-4 pt-3 border-top">
                    <span class="small text-muted">Already registered? </span>
                    <a href="{{ url_for('auth.login') }}" class="small fw-semibold text-decoration-none">Sign In</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
